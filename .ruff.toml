line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "ARG", "PTH"]
ignore = [
    "PLR0913",  # planning functions genuinely take many parameters
    "PLR2004",  # thresholds are explained in context
]

[lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG"]
# A Typer command signature IS the command line interface. Its parameter count is
# set by what the command needs to expose, not by internal design.
"src/shadecast/cli.py" = ["PLR0913", "PLR0917"]
"src/shadecast/surrogate_cli.py" = ["PLR0913", "PLR0917"]
