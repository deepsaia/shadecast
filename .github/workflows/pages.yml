name: Publish pages

# Fires on every merge into main, so a merged pull request refreshes the public pages.
# Only the hand-written pages are published: the landing page, the proposal and the model
# pipeline. The interactive walkthrough needs the city bundles and the engine outputs,
# gigabytes of gitignored local data that no runner has, so it is built and served locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. Queue rather than cancel, so the last merge to land is
# the one that ends up live rather than whichever happens to finish first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every page is present
        run: |
          set -euo pipefail
          for required in src/shadecast/pages/index.html src/shadecast/pages/.nojekyll \
                          src/shadecast/pages/model_pipeline.html src/shadecast/pages/proposal.html; do
            [ -f "$required" ] || { echo "missing $required"; exit 1; }
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/shadecast/pages

      - id: deploy
        uses: actions/deploy-pages@v4
