[project]
name = "shadecast"
version = "0.1.0"
description = "A global open benchmark for urban heat adaptation planning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "solweig-gpu>=2.0.0",
    "torch>=2.4",
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "rasterio",
    "rioxarray",
    "geopandas",
    "shapely",
    "pyproj",
    "pystac-client",
    "planetary-computer",
    "stackstac",
    "duckdb",
    "requests",
    "tqdm",
    "matplotlib",
    "timezonefinder",
    "pytz",
    "boto3>=1.43.80",
    "earthengine-api>=1.7.41",
    "geemap>=0.38.3",
    "typer>=0.27.1",
    "networkx>=3.3",
    "osmnx>=2.0",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
]

[project.scripts]
shadecast = "shadecast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadecast"]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
